spring.application.name=ms
# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# = DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/eventify_springboot
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# = JWT CONFIGURATION
# ===============================
# Base64-encoded secret key (generate with: openssl rand -base64 64)
jwt.secret=796fc8448b6fd9c08681842f7d4c37b30201caaf472a968547b96b16e6dddaea

# Access token lifespan (in milliseconds)
jwt.access-expiration=900000          # 15 minutes
# Refresh token lifespan (in milliseconds)
jwt.refresh-expiration=604800000      # 7 days

# ===============================
# = LOGGING
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.festival.auth=DEBUG

# ===============================
# = SPRING DOC / SWAGGER (Optional)
# ===============================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true